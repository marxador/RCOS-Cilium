<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Select Time Range</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">
  <div class="container d-flex flex-column justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card shadow p-4" style="max-width: 500px; width: 100%;">
      <h2 class="text-center mb-4">Your Spotify Wrapped</h2>
      <form action="/wrapped" method="POST">
        <input type="hidden" name="token" value="{{ token }}">
        
        <div class="mb-3">
          <label for="range" class="form-label">Select a time range</label>
          <select class="form-select" name="range" id="range" required>
            <option value="short_term">Recent (last 4 weeks)</option>
            <option value="medium_term">Half-year (last 6 months)</option>
            <option value="long_term">All-time (1+ years)</option>
          </select>
        </div>
        
        <div class="d-grid">
          <button type="submit" class="btn btn-success">Get My Wrapped</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
