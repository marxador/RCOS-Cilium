apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotify-service-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
        - name: service-a
          image: spotify-service-a:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: spotify-config

---
apiVersion: v1
kind: Service
metadata:
  name: service-a
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30000
  selector:
    app: service-a
